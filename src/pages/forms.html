<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>forms</title>
</head>

<body>
    <form action="#">
        <section class="contact">
            <fieldset>
                <legend>name</legend>
                <label for="name">
                    <input type="text" name="name" id="name" placeholder="nome..." />
                </label>
            </fieldset>
            <fieldset>
                <legend>e-mail</legend>
                <label for="email">
                    <input type="email" name="email" id="email" placeholder="exemplo@email.com" />
                </label>
            </fieldset>
            <fieldset>
                <legend>telefone</legend>
                <label for="telefone">
                    <input type="text" name="telefone" id="telefone" placeholder="+244 9238xxx46" />
                </label>
            </fieldset>
        </section>
        <div class="inform">
            <input type="checkbox" name="show-password" id="showpsw" />
            <label for="show-password">mostrar senha</label>
        </div>
        <button type="submit">enviar</button>
        <div class="option-subscribe">
            se inscreva com:

        </div>
    </form>
</body>

</html>
